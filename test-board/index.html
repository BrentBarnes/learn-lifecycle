<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Test Board 3">
<meta name="theme-color" content="#1f2d5c">
<title>Test Board</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* GrowthBook's own tokens (Inter 14px, navy landmark #1f2d5c, violet #6e56cf, jade/red result cells), because the
   game copies its screens so the habits carry over. Sidebar + main, like the real app. */
:root{
  --bg:#f6f5fb; --panel:#ffffff; --ink:#1f2d5c; --ink2:#4a5480; --muted:#6b7399; --line:#e3e1ef; --line2:#d3d0e6;
  --accent:#6e56cf; --accent-soft:#efebff; --nav:#1f2d5c; --nav-ink:#c9cff0; --nav-active:rgba(255,255,255,.12);
  --win:#18794e; --win-bg:#e3f5ea; --loss:#ce2c31; --loss-bg:#fdecec; --warn:#ad5700; --warn-bg:#fff3e0;
  --gray-bar:#a5a9c2; --run:#18794e; --run-bg:#e3f5ea; --on-fill:#fff;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif; --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#13131b; --panel:#1b1b26; --ink:#e7e6f4; --ink2:#bcbdd8; --muted:#9294b5; --line:#2c2c3c; --line2:#3a3a4e;
  --accent:#9d8cff; --accent-soft:#2a2547; --nav:#0e1430; --nav-ink:#a9b1dd;
  --win:#4cc38a; --win-bg:#13301f; --loss:#ff6b6b; --loss-bg:#3a1719; --warn:#ffb35c; --warn-bg:#3a2a12;
  --gray-bar:#6d708c; --run:#4cc38a; --run-bg:#13301f; --on-fill:#13131b; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--f-body)}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
body.embed .app{grid-template-columns:1fr}body.embed .side{display:none}   /* inside the office game's test board desk */
.side{background:var(--nav);color:var(--nav-ink);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.brand{font-family:var(--f-display);font-weight:800;color:#fff;font-size:1.15rem;padding:0 10px 14px;letter-spacing:.01em}
.brand small{display:block;font:500 .7rem var(--f-mono);color:var(--nav-ink);letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;background:none;border:0;text-align:left;cursor:pointer;color:var(--nav-ink)}
.nav[aria-current="page"]{background:var(--nav-active);color:#fff}
.nav.locked{opacity:.45;cursor:default}
.nav .k{margin-left:auto}
.side .grow{flex:1}
.main{min-width:0;padding:22px clamp(16px,3vw,36px) 60px}
.kbd{display:inline-block;font:700 .72rem/1.5 var(--f-body);min-width:1.6em;text-align:center;padding:0 5px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;background:var(--panel);color:var(--ink)}
.side .kbd{background:transparent;color:var(--nav-ink);border-color:rgba(255,255,255,.25)}
h1,h2{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:1.7rem}h2{font-size:1.15rem}
.muted{color:var(--muted)}
.note{font-size:.8rem;color:var(--muted)}
.btn{font-weight:700;font-size:.88rem;border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid var(--line2);background:var(--panel);display:inline-flex;gap:8px;align-items:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-fill)}
.btn.primary .kbd{background:transparent;color:var(--on-fill);border-color:rgba(255,255,255,.5)}
.btn:focus-visible,.nav:focus-visible,.tab:focus-visible,.dec:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* map */
.mapwrap{max-width:760px}
.mapwrap.wide{max-width:none}
.daily{margin:18px 0 26px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.daily b{font-size:1.02rem}
.path{list-style:none;padding:0;margin:0;position:relative}
.path::before{content:"";position:absolute;left:15px;top:8px;bottom:8px;width:2px;background:var(--line2)}
.node{position:relative;padding:0 0 18px 48px}
.node .dot{position:absolute;left:4px;top:3px;width:24px;height:24px;border-radius:50%;background:var(--bg);border:2px solid var(--line2);display:grid;place-items:center;font:700 .62rem var(--f-mono);color:var(--muted)}
.node.live .dot{border-color:var(--accent);color:var(--accent);background:var(--panel)}
.node.next .dot{box-shadow:0 0 0 0 var(--accent);animation:pulse 1.8s infinite}
.node.done .dot{background:var(--accent);border-color:var(--accent);color:var(--on-fill)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(110,86,207,.45)}70%{box-shadow:0 0 0 10px rgba(110,86,207,0)}100%{box-shadow:0 0 0 0 rgba(110,86,207,0)}}
.node .nm{font-weight:700}
.node.later .nm,.node.later .ds{color:var(--muted)}
.node .ds{font-size:.88rem;color:var(--ink2)}
.node .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
.pips{display:inline-flex;gap:3px;vertical-align:middle}
.pip{width:9px;height:9px;border-radius:3px;background:var(--line2)}
.pip.ok{background:var(--win)}.pip.clean{background:var(--win);box-shadow:0 0 0 2px var(--win-bg)}.pip.miss{background:var(--loss)}
.stat{font:600 .78rem var(--f-mono);color:var(--muted)}

/* experiment page */
.hud{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--nav);color:var(--nav-ink);border-radius:10px;padding:8px 14px;font-size:.8rem;margin-bottom:14px}
.hud .u{font-weight:700;color:#fff}
.chip{font:700 .66rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff}
.hud .pip{background:rgba(255,255,255,.2)}.hud .pip.ok,.hud .pip.clean{background:#4cc38a}.hud .pip.miss{background:#ff6b6b}
.hud .combo{font:700 .9rem var(--f-mono);color:#fff;min-width:2.4em}
.hud .sp{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;position:relative;overflow:hidden}
.crumb{font-size:.78rem;color:var(--muted)}
.xh{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:2px}
.xh h1{font-family:var(--f-body);font-weight:700;font-size:1.3rem}
.status{font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--run-bg);color:var(--run)}
.meta{font-size:.8rem;color:var(--muted);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-top:14px;overflow-x:auto}
.tab{font-size:.86rem;font-weight:600;color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;display:flex;gap:7px;align-items:center;white-space:nowrap;position:relative}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab.off{opacity:.4;cursor:default}
.xtag{font-size:.7rem;font-weight:700;padding:1px 8px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2);margin-left:8px}
.status.draft{background:var(--accent-soft);color:var(--accent)}
.status.stop{background:var(--line);color:var(--ink2)}
.status.lost{background:var(--loss-bg);color:var(--loss)}
.status.due{background:var(--warn-bg);color:var(--warn)}
.backbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);border-radius:8px;padding:8px 12px;margin-bottom:14px;font-size:.9rem}
.xl tr.go{cursor:pointer}
.xl tr.go:hover td,.xl tr.pin td{background:var(--accent-soft)}
.xl .sub{display:block;font-size:.76rem;color:var(--muted);font-weight:400}
.xl .here{color:var(--accent);font-weight:700}
.tab .badge{background:var(--loss);color:var(--on-fill);border-radius:999px;font-size:.66rem;padding:0 6px;line-height:1.5}
.tab.unseen::after{content:"";position:absolute;top:6px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.pane{padding-top:14px;min-height:230px}
.tscroll{overflow-x:auto;max-width:100%}
.rt{border-collapse:collapse;width:100%;min-width:660px;font-size:.84rem}
.rt th{font-size:.7rem;font-weight:600;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.rt td{padding:8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:middle;height:46px}
.rt .sec td{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);background:var(--bg);height:auto;padding:5px 8px}
.rt .sub{display:block;font-size:.7rem;color:var(--muted)}
.cw-win{background:var(--win-bg);color:var(--win);font-weight:700}
.cw-loss{background:var(--loss-bg);color:var(--loss);font-weight:700}
.ov{display:grid;grid-template-columns:max-content 1fr;gap:7px 20px;font-size:.88rem;max-width:70ch;margin:0}
.ov dt{color:var(--muted)}.ov dd{margin:0}
.hl{outline:2px solid var(--warn);outline-offset:-2px;background:var(--warn-bg)!important;border-radius:4px}
.hint{margin-top:14px;background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:.86rem;color:var(--ink)}
.hint b{color:var(--accent)}
.decide{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.dec{font-size:.86rem;font-weight:600;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:8px 12px;cursor:pointer;display:flex;gap:8px;align-items:center}
.dec:hover:not(:disabled){border-color:var(--accent)}
.dec:disabled{opacity:.55;cursor:default}
.dec.right{border-color:var(--win);background:var(--win-bg);opacity:1}.dec.wrong{border-color:var(--loss);background:var(--loss-bg);opacity:1}
.pxf{width:44px;height:44px;image-rendering:pixelated;float:left;margin:0 10px 4px 0;border-radius:8px;background:#efe6d8;border:2px solid #2a2430}
.pxban{display:flex;gap:14px;align-items:flex-end;max-width:820px;margin:0 0 16px}
.pxban .pxroom{width:min(384px,52%);height:auto;aspect-ratio:320/192;flex:none;border-radius:12px;border:3px solid #2a2430;image-rendering:pixelated;background:#b37d50}
.pxban .pxsay{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:10px;align-items:center;background:#fffdf8;border:3px solid #2a2430;border-radius:10px;padding:8px 12px;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.pxban .pxsay{position:relative;left:auto;right:auto;bottom:auto;flex:1;margin-bottom:18px}
.pxban .pxsay::before{content:"";position:absolute;left:-11px;bottom:18px;border:8px solid transparent;border-right-color:#2a2430}
@media (max-width:640px){.pxban{flex-direction:column;align-items:stretch}.pxban .pxroom{width:100%}.pxban .pxsay{margin:0}.pxban .pxsay::before{display:none}}
.pxban .pxsay .pxf{float:none;margin:0;width:52px;height:52px}
.pxban .pxsay b{display:block;font:700 .78rem var(--f-mono,monospace);letter-spacing:.04em;color:#6e56cf}.pxban .pxsay span{color:#2a2230}
.strip{margin-top:14px;border-left:3px solid var(--line2);padding:8px 12px;font-size:.9rem;color:var(--ink2);min-height:2.6em}
.strip.clean{border-color:var(--win)}.strip.ok{border-color:var(--warn)}.strip.miss{border-color:var(--loss)}
.strip b.t{color:var(--ink);margin-right:4px}
.strip .acts{clear:both;margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.stamp{position:absolute;right:26px;top:22px;font:800 1.55rem var(--f-display);letter-spacing:.06em;padding:5px 14px;border:4px solid currentColor;border-radius:8px;transform:rotate(-8deg);pointer-events:none;opacity:0;text-transform:uppercase}
.stamp.on{animation:stamp .32s cubic-bezier(.2,1.6,.4,1) forwards}
.stamp.big{animation:stampbig .6s cubic-bezier(.2,1.6,.4,1) forwards}
.stamp.good{color:var(--win)}.stamp.bad{color:var(--loss)}
@keyframes stamp{0%{opacity:0;transform:rotate(-8deg) scale(1.9)}100%{opacity:.92;transform:rotate(-8deg) scale(1)}}
@keyframes stampbig{0%{opacity:0;transform:rotate(-8deg) scale(2.6)}55%{opacity:1;transform:rotate(-8deg) scale(1.25)}100%{opacity:.95;transform:rotate(-8deg) scale(1.1)}}
.shake{animation:shake .15s linear 1}
@keyframes shake{0%,100%{transform:none}33%{transform:translateX(-4px)}66%{transform:translateX(4px)}}
.passcard{margin-top:16px;border:2px solid var(--accent);border-radius:12px;padding:16px 18px;background:var(--accent-soft)}
.passcard h2{color:var(--accent)}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}
.sum div{background:var(--panel);border-radius:8px;padding:10px 12px}
.sum .n{font:800 1.6rem var(--f-display)}
.sum .l{font-size:.76rem;color:var(--muted)}

/* U1 setup + dots */
.setup{margin-bottom:14px}
.slack{display:flex;gap:10px;background:var(--bg);border-radius:10px;padding:10px 12px;max-width:70ch}
.slack .av{flex:none;width:32px;height:32px;border-radius:8px;background:var(--accent);color:var(--on-fill);display:grid;place-items:center;font-weight:700}
.slack p{margin:2px 0 0}
.piles{display:flex;gap:24px;flex-wrap:wrap;margin-top:16px}
.pl{font-size:.82rem;font-weight:600;margin-bottom:6px}
.pile{display:grid;grid-template-columns:repeat(10,14px);gap:4px}
.pile i,.lg{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--gray-bar);opacity:.55;vertical-align:middle}
.pile i.g,.lg.g{background:#e0a100;opacity:1}
.pile i.x,.lg.x{background:transparent;border:1.5px dashed var(--gray-bar);opacity:.7}
.pile i{animation:pop .3s ease-out backwards}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
.also{margin-top:8px;font-size:.8rem;display:flex;gap:6px;flex-wrap:wrap;align-items:center;max-width:200px}
.chipx{background:var(--warn-bg);color:var(--warn);border-radius:999px;padding:1px 8px;font-weight:600}
/* U1 steps on the map */
.steps{list-style:none;margin:8px 0 6px;padding:0;display:flex;flex-direction:column;gap:4px;max-width:560px}
.step{display:flex;align-items:center;gap:10px;padding:5px 8px;border-radius:8px;background:var(--panel);border:1px solid var(--line)}
.step .sn{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 .66rem var(--f-mono);border:2px solid var(--line2);color:var(--muted)}
.step.live .sn{border-color:var(--accent);color:var(--accent)}.step.done .sn{background:var(--accent);border-color:var(--accent);color:var(--on-fill)}
.step.later{opacity:.55}.step.next{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.step .snm{font-weight:600;font-size:.88rem}.step .sp{flex:1}
.btn.sm{padding:4px 10px;font-size:.8rem}
.btn.ghost{border-style:dashed}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline}
/* setup card extras */
.setup dt.cur,.setup dd.cur{background:var(--accent-soft)}.setup dd.cur{outline:2px solid var(--accent);outline-offset:-2px;border-radius:4px}
.setup dt.mk{color:var(--accent);font-weight:700}.setup dd.mk{font-weight:600}
.setup dd,.setup dt{padding:3px 6px}
.setup .means{display:block;font-size:.78rem;color:var(--accent)}
.gchk{margin-left:8px;color:var(--win);font-weight:700;font-size:.8rem}
.gq{flex-basis:100%;font-size:.92rem}
/* lessons */
.lesson{max-width:720px}
.lesson h1{margin:6px 0 10px}
.lp{font-size:1rem;max-width:62ch}
.lvis{margin:14px 0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.lvis .piles{margin-top:0}
.predict .pq{font-weight:700;margin-top:6px}
.reveal{background:var(--accent-soft);border-radius:8px;padding:10px 12px;margin-top:12px}
.lnav{display:flex;gap:10px;align-items:center;margin-top:18px}
.exlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.exlist li{display:flex;gap:10px;align-items:baseline}
.exlist .tag{flex:none;font:700 .66rem var(--f-mono);text-transform:uppercase;letter-spacing:.06em;padding:1px 7px;border-radius:999px}
.exlist .fair .tag{background:var(--win-bg);color:var(--win)}.exlist .bad .tag{background:var(--loss-bg);color:var(--loss)}
.tline{display:flex;gap:10px;flex-wrap:wrap}
.tblock{flex:1;min-width:150px;border:1px solid var(--line2);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.tblock .also{max-width:none}
.sl{border-bottom:3px solid}.sl-assign{border-color:#e0a100}.sl-count{border-color:var(--accent)}.sl-when{border-color:var(--win)}
.slack sub{font:700 .6rem var(--f-mono);text-transform:uppercase;color:var(--muted);margin-left:3px;vertical-align:baseline}
/* U2 board */
.board{display:grid;grid-template-columns:130px repeat(8,minmax(62px,1fr));min-width:640px;position:relative;column-gap:0;row-gap:4px}
.bh{font-size:.72rem;font-weight:600;color:var(--muted);padding:4px 6px;border-bottom:1px solid var(--line)}
.bh.fz{color:var(--warn)}
.rl{grid-column:1;font-size:.8rem;font-weight:600;align-self:center;padding-right:8px}
.rl.new{color:var(--accent);font-weight:700}
.pastcol{background:var(--line);z-index:0}
.bh.past{opacity:.45}

.fzcol{background:repeating-linear-gradient(135deg,var(--warn-bg) 0 6px,transparent 6px 12px);border-left:1px dashed var(--warn);border-right:1px dashed var(--warn);z-index:0}
.cell{z-index:1;border-radius:6px}
.cell.pick{cursor:pointer;background:var(--accent-soft);opacity:.45;margin:0 1px}
.cell.pick:hover{opacity:.9}
.bar{z-index:2;margin:0 2px;border-radius:7px;padding:3px 8px;font-size:.72rem;line-height:1.25;overflow:hidden;display:flex;flex-direction:column;justify-content:center;border:1.5px solid}
.bar b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar.crea{background:var(--accent-soft);border-color:var(--accent)}
.bar.offer{background:var(--warn-bg);border-color:var(--warn)}
.bar.ghost{border-style:dashed;box-shadow:0 2px 10px rgba(110,86,207,.25);pointer-events:none;transition:grid-column .1s}
.bar.ghost.set{border-style:solid;border-color:var(--win);background:var(--win-bg)}
.bar.ghost.miss{border-color:var(--loss)}
.bar.hl{outline:3px solid var(--loss);outline-offset:2px;background:var(--loss-bg)!important;border-radius:7px}
.fzcol.hl{outline:3px solid var(--loss);outline-offset:-1px}
.bar em{font-style:normal;font-weight:700}.bar em.hl{color:var(--loss)}
.lg.crea,.lg.offer,.lg.fz{border-radius:3px;opacity:1}
.lg.crea{background:var(--accent-soft);border:1.5px solid var(--accent)}.lg.offer{background:var(--warn-bg);border:1.5px solid var(--warn)}
.lg.fz{background:repeating-linear-gradient(135deg,var(--warn-bg) 0 3px,transparent 3px 6px);border:1px dashed var(--warn)}
.bar.mark{outline:3px solid #e0a100;outline-offset:2px}
.lg.mk{border-radius:3px;opacity:1;outline:2px solid #e0a100;outline-offset:-2px}
.colhl{z-index:1;background:rgba(224,161,0,.18);border-left:2px solid #e0a100;border-right:2px solid #e0a100;pointer-events:none}
.rl.cur{background:var(--accent-soft);outline:2px solid var(--accent);border-radius:4px;padding-left:4px}
.bar.cur{outline:3px solid var(--accent);outline-offset:2px}
.fzcol.cur{outline:3px solid var(--accent);outline-offset:-1px}
.meta .cur{outline:2px solid var(--accent);border-radius:4px;padding:0 3px;background:var(--accent-soft)}
.checks{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}.checks b{margin-right:4px}
.gok{display:inline-block;margin-right:8px;color:var(--win);font-weight:600}
.gatefb{font-size:.84rem;font-weight:600;min-height:1.4em;margin-top:4px}
.gatefb.good{color:var(--win)}.gatefb.bad{color:var(--loss)}

#flows tr.hl td,#lane tr.hl td{background:var(--warn-bg)}
.lane{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.laneh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}.laneh small{color:var(--muted);font-size:.78rem}
.laneh .n{background:var(--ink);color:var(--panel);border-radius:999px;font-size:.72rem;font-weight:700;padding:1px 7px}
#lane .lbar{display:inline-block;height:9px;border-radius:4px;background:var(--accent);opacity:.75;margin-right:6px;vertical-align:0}
#lane .exp{color:var(--muted)}#lane tr.mk td{background:var(--accent-soft)}#lane tr.mk td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
#lane th.cur{background:var(--accent-soft);outline:2px solid var(--accent);outline-offset:-2px}#lane td.cur,#lane td.hl{outline:3px solid var(--accent);outline-offset:-3px}
#lane th.hl{outline:3px solid var(--loss);outline-offset:-3px;background:var(--loss-bg)}
.see{display:inline-block;font-size:.74rem;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.see.n{background:var(--line2);color:var(--ink2)}.see.g{background:var(--win-bg);color:var(--win)}.see.m{background:var(--warn-bg);color:var(--warn)}.see.b{background:var(--line2);color:var(--muted)}
.bar.qdue{outline:2px solid var(--warn);outline-offset:1px}
.qback{margin-top:12px}
.qrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.qrl{font-size:.74rem;color:var(--muted);min-width:120px}
.qcard{font:inherit;font-size:.78rem;padding:4px 9px;border-radius:7px;border:1.5px solid;cursor:pointer;background:var(--panel);color:inherit}
.qcard.crea{border-color:var(--accent)}.qcard.offer{border-color:var(--warn)}
#qlane small{display:block;color:var(--muted);font-size:.72rem;font-weight:400}#qlane .exp{color:var(--muted)}
#qlane .lbar{display:inline-block;height:9px;border-radius:4px;background:var(--accent);opacity:.75;margin-right:6px}
#qlane tr.go{cursor:pointer}#qlane tr.on td{background:var(--accent-soft)}#qlane tr.on td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.qcard.on{background:var(--accent);border-color:var(--accent);color:var(--on-fill)}.qcard.offer.on{background:var(--warn);border-color:var(--warn)}
.qwhat{display:block;margin-top:6px}
span.lost{color:var(--loss)}
@media (prefers-reduced-motion: reduce){.stamp.on,.stamp.big{animation:none;opacity:.92}.shake,.node.next .dot{animation:none}}
</style>
</head>
