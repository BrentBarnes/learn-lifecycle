<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn Lifecycle</title>
<link rel="icon" type="image/png" sizes="32x32" href="/px/icons/office-32.png"><link rel="apple-touch-icon" href="/px/icons/office-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Silkscreen&family=Special+Elite&family=Caveat:wght@500;700&display=swap">
<style>
:root{
  --bg:#17131a; --panel:#fffdf8; --ink:#2a2230; --ink2:#5a5262; --muted:#8a8293; --line:#e6e0d6; --accent:#6e56cf; --accent-soft:#efebff;
  --win:#1f8a5b; --win-bg:#e3f5ec; --loss:#c8463a; --loss-bg:#fbe7e4; --warn:#b7791f; --warn-bg:#fdf3dd;
  --term:#14201a; --term-ink:#cfe9d8; --term-dim:#7fa58f; --term-hi:#5fd38a;
  --f-body:"Inter",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace; --f-pix:"Silkscreen","Inter",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body)}
.shell{display:flex;min-height:100%}
.center{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
/* the day list: a level select on the left */
.days{width:268px;flex:none;background:#120f15;border-right:3px solid #2a2430;color:#d9cfe2;display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
.dtop{padding:12px 14px 8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.dtop b{font:14px var(--f-pix);color:#f6c85f;letter-spacing:.05em}
.dtop a,.dtop button{font:12px var(--f-body);color:#8f859a;background:none;border:0;padding:0;text-decoration:underline;cursor:pointer}
.devb{font:11px var(--f-pix);color:#f5a524;display:flex;gap:6px;align-items:baseline}.devb[hidden]{display:none}
.dlist{flex:1;overflow:auto;padding:0 8px 8px;display:flex;flex-direction:column;gap:4px}
.dl{text-align:left;background:#1b1720;border:1.5px solid #2c2633;border-radius:8px;padding:7px 9px;color:#d9cfe2;font:12px/1.35 var(--f-body);cursor:pointer;display:flex;flex-direction:column;gap:2px}
.dl:hover{border-color:#5a4a7a}.dl.cur{border-color:var(--accent);background:#241d33}.dl.shut{opacity:.4;cursor:not-allowed}
.dl .dh{font-size:12.5px;color:#fff}.dl .dh b{font:12px var(--f-pix);color:#f6c85f;margin-right:4px}.dl .dok{font:10px var(--f-pix);color:#8fe0b2;margin-left:4px}
.dl .dr{display:flex;gap:6px;align-items:center;color:#b9aec4}.dl .dr em{font-style:normal;opacity:.6}
i.dk{width:12px;height:12px;flex:none;border:1.5px solid #4a4252;border-radius:3px;font:9px/9px var(--f-body);color:#0d2a1c;text-align:center;font-style:normal}
i.dk.ok{background:#5fd38a;border-color:#5fd38a}i.dk.na{border-style:dashed}
/* the tracks: each role's lessons, passed ones ticked, today's marked */
.dday{font-size:12.5px;color:#fff;display:flex;gap:6px;align-items:center}.dday b{font:13px var(--f-pix);color:#f6c85f}
.dstep{font:11px var(--f-body);background:#2a2430;color:#d9cfe2;border:1px solid #4a4252;border-radius:4px;padding:0 6px;cursor:pointer;text-decoration:none!important}
.trk{border:1.5px solid #2c2633;border-radius:8px;background:#1b1720}.trk.on{border-color:#4a3d66}
.th{width:100%;display:flex;align-items:center;gap:8px;background:none;border:0;color:#fff;padding:7px 9px;cursor:pointer;text-align:left}
.th .tn{flex:1;font:12px var(--f-pix);color:#f6c85f;display:flex;flex-direction:column}.th .tn small{font:11px var(--f-body);color:#9a8fa6}
.th .io{font:10px var(--f-pix);padding:1px 6px;border-radius:3px;background:#3a2f33;color:#d98a8a}.th .io.in{background:#1d3a2c;color:#8fe0b2}
.th .tc{font:11px var(--f-mono);color:#9a8fa6}
.trk.off .th .tn{color:#9a8fa6}
.tl{padding:0 6px 6px;display:flex;flex-direction:column;gap:1px}.tl[hidden]{display:none}
.tg{font:10px var(--f-pix);color:#7d7389;margin:6px 4px 2px;letter-spacing:.03em}
.lr{display:flex;gap:6px;align-items:center;text-align:left;background:none;border:1px solid transparent;border-radius:5px;padding:2px 5px;color:#b9aec4;font:12px/1.3 var(--f-body)}
.lr:not(:disabled){cursor:pointer}.lr:not(:disabled):hover{border-color:#5a4a7a;background:#241d33}
.lr.ok{color:#8f859a}.lr.na{opacity:.45}.lr.cur{background:#2c2342;border-color:var(--accent);color:#fff}.lr span{flex:1}
.lr .today{font:9px var(--f-pix);font-style:normal;color:#f6c85f}
.chip.clk{background:#2a2430;color:#f6c85f;border-color:#5a4a3a}
/* the time clock and the hiring screen: one time card per role */
.sheet.clock{width:min(940px,100%)}.cbody{padding:18px 20px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:12px 0}
.tcard{position:relative;text-align:left;display:flex;flex-direction:column;gap:4px;background:#f3e6c8;border:2px solid #c9b48a;border-radius:4px;padding:26px 14px 14px;cursor:pointer;font:13px/1.35 "Special Elite","Courier New",monospace;color:#3a2e1c;box-shadow:0 3px 0 #0002;transition:transform .12s}
.tcard:hover{transform:translateY(-2px)}.tcard .band{position:absolute;left:0;right:0;top:0;height:10px;background:var(--band)}
.tcard .kbd{position:absolute;right:8px;top:14px}
.tcard .tr{font-size:20px;color:#1d1722}.tcard .tw{font:600 12px var(--f-body);color:#6b5a3c}.tcard .td{font-size:12.5px}
.tcard .tp{font-size:12px;color:#6b5a3c;border-top:1px dashed #c9b48a;padding-top:6px;margin-top:4px}.tcard .tnext{font-size:12.5px}
.tcard .stamp{align-self:flex-start;margin-top:6px;font:700 15px var(--f-mono);letter-spacing:.12em;padding:1px 8px;border:2.5px solid #b44a3a;color:#b44a3a;border-radius:4px;transform:rotate(-4deg);opacity:.85}
.tcard.in{background:#fbf3df;border-color:#5f9a6f}.tcard.in .stamp{border-color:#2f7d4f;color:#2f7d4f}
.imp{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px;margin-top:6px}.imp .done{flex:1;min-width:260px;font-size:12.5px}
.imp[hidden]{display:none}
.sheet.hire .asks{margin-bottom:6px}.recap .lg{color:var(--muted);font-size:12.5px}
@media (max-width:820px){.cards{grid-template-columns:1fr}}
.dfoot{padding:8px 14px 12px;font-size:12px;border-top:1px solid #2a2430}.dfoot a{color:#8f859a}
@media (max-width:980px){.shell{flex-direction:column}.days{width:auto;height:auto;max-height:200px;position:static;border-right:0;border-bottom:3px solid #2a2430}.dlist{flex-direction:row;overflow-x:auto}.dl{min-width:200px}}
.top{width:100%;max-width:1000px;display:flex;gap:12px;align-items:center;padding:10px 16px;color:#efe6d8;flex-wrap:wrap}
.top .day{font:13px var(--f-pix);letter-spacing:.04em;color:#f6c85f}
.top .obj{flex:1;min-width:220px;font-weight:600}
.top .obj .kbd{margin-left:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:11px var(--f-pix);padding:3px 8px;border-radius:4px;background:#2a2430;color:#b9aec4;border:1px solid #3a3242}
.chip.now{background:#3a2f55;color:#fff;border-color:var(--accent)}
.chip.ok{background:#1d3a2c;color:#8fe0b2;border-color:#2f6b4c}
.chip.retry{background:#3d321a;color:#f3cf86;border-color:#7a6230}
.stage{position:relative;padding:0 16px;max-width:100%}
canvas#room{display:block;max-width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;border:4px solid #2a2430;border-radius:6px;background:#000;cursor:pointer}
.say{position:absolute;left:16px;right:16px;bottom:0;margin:0 auto;max-width:calc(100% - 32px);display:flex;gap:12px;align-items:flex-start;
  background:#fffdf8;border:4px solid #2a2430;border-radius:8px;padding:12px 14px;box-shadow:0 6px 0 rgba(0,0,0,.35);transform:translateY(calc(100% + 16px))}
.say[hidden]{display:none}
.say img{image-rendering:pixelated;width:84px;height:84px;flex:none;background:#efe6d8;border-radius:6px;border:2px solid #2a2430}
.say .who{font:12px var(--f-pix);color:var(--accent)}
.say .txt{min-height:42px}
.say .more{font:11px var(--f-pix);color:var(--muted);margin-top:4px;visibility:hidden}
.say.ready .more{visibility:visible;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.tip{position:absolute;transform:translate(-50%,-100%);background:#fffdf8;color:var(--ink);font:600 12px var(--f-body);padding:3px 8px;border:2px solid #2a2430;border-radius:6px;white-space:nowrap;pointer-events:none;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.tip .kbd{color:var(--ink2);border-color:var(--line)}.tip.dim{opacity:.75;font-weight:500}
.tip[hidden]{display:none}
.banner{position:absolute;inset:0 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(23,19,26,.82);border-radius:6px;color:#efe6d8;transition:opacity .45s}
.banner b{font:28px var(--f-pix);color:#f6c85f;letter-spacing:.05em}.banner span{font:13px var(--f-pix);margin-top:6px}
.banner.out{opacity:0}.banner[hidden]{display:none}
.snd{background:none;border:0;color:#8f859a;font:12px var(--f-body);text-decoration:underline;cursor:pointer;padding:0}
.under{height:150px}
.help{color:#8f859a;font-size:12px;margin:6px 0 20px;text-align:center}
.kbd.dk{color:var(--ink2);border-color:var(--line)}
.kbd{display:inline-block;font:600 11px/1.6 var(--f-mono);min-width:1.7em;text-align:center;padding:0 5px;border:1px solid #4a4252;border-bottom-width:2px;border-radius:4px;color:#efe6d8}
/* desk panels: the real tool screens */
.desk{position:fixed;inset:0;background:rgba(15,10,20,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.desk[hidden]{display:none}
.desk:not([hidden]) .sheet{animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}
.sheet{background:var(--panel);border:4px solid #2a2430;border-radius:10px;width:min(1080px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5);display:flex;flex-direction:column}
.sheet.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.sheet header{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line)}
.sheet header b{font:15px var(--f-pix);letter-spacing:.03em}.sheet header .sp{flex:1}.sheet header .tool{font-size:12px;color:var(--muted)}
.sheet .body{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:0}
.sheet .main{padding:16px 18px;border-right:1px solid var(--line);min-width:0}
.sheet .side{padding:16px 18px;background:#faf7f1}
.side .asks{margin-bottom:4px}
.x{font:600 12px var(--f-body);border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 10px;cursor:pointer}
.q{font-weight:700;font-size:15px;margin:0 0 10px}
.qn{font:11px var(--f-pix);color:var(--accent);margin-bottom:4px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;font:14px var(--f-body);border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:9px 12px;cursor:pointer;display:flex;gap:10px;align-items:center}
.opt:hover{border-color:var(--accent)}
.opt .kbd{color:var(--ink2);border-color:var(--line)}
.opt.right{border-color:var(--win);background:var(--win-bg)}.opt.wrong{border-color:var(--loss);background:var(--loss-bg)}
.guide{margin-top:12px;font-size:13px;background:var(--accent-soft);border-radius:8px;padding:8px 10px;color:#3d2f7a}
.guide b{font-weight:700}
.fb{margin-top:12px;font-size:13px;border-radius:8px;padding:8px 10px}
.fb.good{background:var(--win-bg);color:#145c3c}.fb.bad{background:var(--loss-bg);color:#8a2b22}
.go{margin-top:12px;font:700 14px var(--f-body);background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer}
.go .kbd{color:#fff;border-color:rgba(255,255,255,.5)}
.done{color:var(--muted);font-size:13px}
/* a pixel portrait beside whoever is asking */
.pix{image-rendering:pixelated;image-rendering:crisp-edges;border-radius:6px;flex:none;border:2px solid #2a2430;background:#efe6d8}
.asks{display:flex;gap:10px;align-items:flex-start}
.asks .bub{position:relative;flex:1;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:7px 11px}
.asks .bub::before{content:"";position:absolute;left:-7px;top:16px;width:10px;height:10px;background:#fff;border-left:1.5px solid var(--line);border-bottom:1.5px solid var(--line);transform:rotate(45deg)}
.asks .who{font:11px var(--f-pix);color:var(--accent)}.asks .who small{font:500 11px var(--f-body);color:var(--muted)}
.asks .q{margin:2px 0 0}
.recap .asks{margin:6px 0 4px}.recap .asks .q{font-size:18px}
/* Frank Mallory's desk: SQL Gauntlet's Detective mode, in Fernhill */
.term .main{background:#0f0c0a}
.scene{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.scene .col{display:flex;flex-direction:column;gap:6px;min-width:0}
.scene .panel{position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden;border:3px solid #2a2522;background:#000}
.scene .panel canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.scene .corpimg{background:url(pix/corp_side_fernhill.png) center/100% 100% no-repeat;image-rendering:pixelated}
.scene img.inpanel{position:absolute;left:44%;bottom:12%;width:30%;height:auto;border:0;background:none;border-radius:0}
.cbub{background:#fff;border:1px solid #d3dbe7;border-radius:10px;padding:7px 10px;font-size:13px;line-height:1.4;color:#1c2533}
.cbub.react{border-color:#9fd8b5;background:#f2fbf5}.cbub.puzzled{border-color:#f0b4b4;background:#fff5f5}
.cwho{font-weight:700;font-size:12px;color:#2f5fc4}.cwho small{color:#8392ab;font-weight:500}
.noircol .dbub{background:#14100c;border:1px solid #3a2e22;border-radius:10px;padding:7px 10px;color:#eadcbf;font-family:"Special Elite","Courier New",monospace}
.ctitle{font-size:15px;color:#f2c46d;text-transform:uppercase;letter-spacing:.06em;text-shadow:0 0 10px #f2c46d44}
.dsay{font-size:13.5px;line-height:1.45;min-height:3em}.dsay::before{content:"“"}.dsay::after{content:"”"}
.dname{margin-top:4px;font-size:10px;letter-spacing:.14em;color:#8d7b5d}
.cork{position:relative;display:flex;flex-wrap:wrap;gap:18px 28px;justify-content:space-around;align-items:flex-start;padding:20px 16px 16px;border-radius:8px;border:6px solid #4a2f1a;box-shadow:inset 0 0 30px #0007;background:url(pix/cork.png) 0 0/64px 64px;image-rendering:pixelated}
.bcard{position:relative;z-index:1;background:#fbf6e6;color:#2b2620;padding:10px 14px 8px;min-width:190px;box-shadow:2px 5px 9px #0007;transform:rotate(-2deg);font-family:"Special Elite",monospace}
.bcard h4{margin:0 0 6px;font-size:15px;border-bottom:1px solid #cdbf9e;padding-bottom:3px}
.bcard ul{margin:0;padding:0}.bcard li{list-style:none;font-size:13.5px;padding:1px 5px;border-radius:3px;transition:background .2s}
.bcard li i{color:#8a7c62;font-style:normal;font-size:11px;margin-left:6px}
.bcard li.glow{background:#ffe066;box-shadow:0 0 0 1px #d9a400,0 0 10px #ffe06699}
.bsmall{font-size:11px;color:#8a7c62;margin-top:6px;max-width:200px}
.pin{position:absolute;top:-10px;left:calc(50% - 6px);width:12px;height:16px;background:url(pix/pin.png) center/12px 16px no-repeat;image-rendering:pixelated;filter:drop-shadow(1px 3px 2px #0008)}
.bnote{position:relative;z-index:1;max-width:280px;background:#fff27a;color:#2a2414;padding:12px 12px 10px;box-shadow:2px 5px 9px #0006;transform:rotate(2.5deg);font:500 18px/1.15 "Caveat",cursive}
.bnote b{display:block;font:700 20px "Caveat",cursive;color:#8a0f19}.bnote small{display:block;margin-top:4px;font-size:16px;color:#5a4a1a}
svg.strings{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;overflow:visible}
svg.strings circle{fill:#b3121f}
svg.strings path{fill:none;stroke:#b3121f;stroke-width:2.2;opacity:.85;transition:d .4s}
svg.strings.hot path{stroke:#ff2a3a;filter:drop-shadow(0 0 3px #ff2a3a99)}
.term .res{overflow-x:auto;white-space:nowrap;background:#070a08;border:1px solid #1f3a2b;border-radius:6px;padding:6px 8px;position:relative}
.term .res::before{content:"● REC";position:absolute;right:8px;top:4px;font:10px var(--f-mono);color:#e5484d;animation:blink 1.2s steps(2) infinite}
/* dashboard */
.kpi{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:8px}.kpi div{font-size:12px;color:var(--muted)}.kpi b{display:block;font-size:20px;color:var(--ink)}
svg.chart{width:100%;height:auto;display:block}
svg.chart .band{fill:#e7e2f7}svg.chart .avg{fill:none;stroke:var(--accent);stroke-width:2.5}svg.chart .dot{fill:#9c93ad}
svg.chart .ax{font:10px var(--f-body);fill:var(--muted)}svg.chart .hit{fill:transparent;cursor:crosshair}svg.chart .hit:hover{fill:rgba(110,86,207,.12)}
svg.chart .cur{stroke:var(--accent);stroke-width:1;opacity:.6}svg.chart .curdot{fill:var(--accent)}svg.chart .curlab{font:600 11px var(--f-body);fill:var(--accent)}
.legend{display:flex;gap:12px;align-items:flex-end;font-size:12px;color:var(--ink2);flex-wrap:wrap}.legend span{display:flex;align-items:center;gap:5px}
.sw{display:inline-block;width:14px;height:10px;border-radius:2px}.sw.line{height:3px;background:var(--accent)}.sw.dot{width:6px;height:6px;border-radius:50%;background:#9c93ad}.sw.band{background:#e7e2f7}
svg.chart .pick{stroke:var(--accent);stroke-width:2;stroke-dasharray:4 3}svg.chart .ans{stroke:var(--win);stroke-width:2}
table.t{border-collapse:collapse;width:100%;font-size:12.5px;margin-top:10px}
table.t th,table.t td{padding:5px 7px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{font-size:11px;color:var(--muted);font-weight:600}
table.t td.down{color:var(--loss);font-weight:700}table.t td.flat{color:var(--ink2)}
table.t tr.em td{background:#f6f2ea;font-weight:700;text-align:left}
.tscroll{overflow-x:auto}
/* SQL terminal */
.term .main{background:var(--term);color:var(--term-ink)}
.term .main .qn{color:var(--term-hi)}
.schema{font:12.5px var(--f-mono);color:var(--term-dim);margin-bottom:10px}
.schema b{color:var(--term-ink)}

textarea.sql{width:100%;min-height:96px;font:15px/1.5 var(--f-mono);background:#0d1611;color:#e6fff0;border:1px solid #2c4a3a;border-radius:8px;padding:10px;resize:vertical;caret-color:var(--term-hi)}
textarea.sql:focus{outline:2px solid var(--term-hi);outline-offset:1px}
.res{font:12.5px var(--f-mono);margin-top:10px;color:var(--term-ink)}
.res table{border-collapse:collapse}.res td,.res th{padding:2px 10px 2px 0;text-align:left}.res th{color:var(--term-dim);font-weight:400}
.res .err{color:#ff9d8f}.res .cnt{color:var(--term-dim);margin-top:4px}
.example{font:12.5px var(--f-mono);background:#eef3ef;border-radius:6px;padding:6px 8px;margin-top:6px;color:#2a4a38}
/* test board */
table.pw td.cell{cursor:pointer}table.pw td.cell:hover{background:var(--accent-soft)}
table.pw td.ok{background:var(--win-bg);color:var(--win);font-weight:700}table.pw td.sel{outline:2px solid var(--accent);outline-offset:-2px}
.board{display:grid;gap:2px;margin-top:8px;font-size:11.5px}
.board .h{color:var(--muted);text-align:center;font-weight:600}.board .rl{font-weight:700;padding:6px 4px}
.board .c{min-height:34px;border-radius:4px;background:#f3efe7;cursor:pointer;position:relative}
.board .c:hover{background:var(--accent-soft)}
.board .c.fz{background:repeating-linear-gradient(135deg,#e9e3d6 0 6px,#f6f2ea 6px 12px);cursor:not-allowed}
.board .bar{position:absolute;inset:3px;border-radius:4px;background:#6fb7d6;color:#0d3446;font-weight:600;padding:2px 5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:11px}
.board .bar.new{background:var(--accent);color:#fff;z-index:2}
.board .bar.preview{opacity:.55;pointer-events:none}.board .bar.clash{background:var(--loss)}
table.pw td.kcur{background:var(--accent-soft)}.board .c.kcur{outline:2px solid var(--accent);outline-offset:-2px}
code{font:12.5px var(--f-mono);background:rgba(0,0,0,.06);padding:0 4px;border-radius:3px;font-variant-ligatures:none}.board .bar.ghost{opacity:.45}
.recap{padding:22px 24px}
.recap h2{margin:0 0 6px;font-size:22px}
.recap .big{display:flex;gap:22px;flex-wrap:wrap;margin:14px 0}
.recap .big div{font-size:12px;color:var(--muted)}.recap .big b{display:block;font-size:26px;color:var(--ink)}
.recap ul{padding-left:18px}.recap li{margin:4px 0}
@media (max-width:820px){.scene{grid-template-columns:1fr}.sheet .body{grid-template-columns:1fr}.sheet .main{border-right:0;border-bottom:1px solid var(--line)}}
@media (prefers-reduced-motion: reduce){.sheet.shake,.desk:not([hidden]) .sheet,.say.ready .more{animation:none}.banner{transition:none}}
/* desks that frame a real game */
.sheet.framed{width:min(1360px,100%);height:calc(100vh - 32px);max-height:none;overflow:hidden}
.sheet.framed iframe{flex:1;border:0;width:100%;background:#f5f6f8;display:block}
/* full screen: any desk fills the screen (the button or \); Esc leaves full screen first */
.sheet:fullscreen{width:100vw;max-width:none;height:100vh;max-height:none;border:0;border-radius:0;box-shadow:none}
.sheet:fullscreen.framed{height:100vh}
/* Frank's pin board can float in its own window (popBoard): the board here hides while it's out */
.cork .pop{position:absolute;top:6px;right:8px;z-index:3;font:11px var(--f-pix);color:#2b2620;background:#fbf6e6;border:2px solid #4a2f1a;border-radius:4px;padding:3px 8px;cursor:pointer;box-shadow:2px 2px 0 #0006}
.cork .pop:hover{background:#fff}
html.board-out .sheet .cork{display:none}
html.desk-pip body{background:#2a1c12;min-height:100vh}
html.desk-pip .pipwrap{padding:10px}html.desk-pip .piphead{font:12px var(--f-pix);color:#f6c85f;letter-spacing:.06em;margin-bottom:8px}
html.desk-pip .cork{margin:0}
.chipok{font:11px var(--f-pix);color:var(--win);background:var(--win-bg);border-radius:4px;padding:2px 8px}.chipok[hidden]{display:none}
/* Frank's lessons */
.sheet .body.one{grid-template-columns:1fr}.body.one .main{border-right:0}
.lessoncol{background:#fbf6e6;color:#2b2620;border-radius:8px;padding:10px 14px;border:3px solid #2a2522}
.lessoncol .qn{color:#8a0f19}.word{font:700 20px var(--f-mono);margin:2px 0 6px;font-variant-ligatures:none}
.lines{margin:0;padding-left:18px;font-size:13.5px}.lines li{margin:3px 0}.lines code{background:rgba(0,0,0,.07)}
.example.foreign small{display:block;font:600 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#6b7f73;margin-bottom:3px}
.example.big{font-size:15px;padding:10px 12px;background:#0d1611;color:#e6fff0;border:1px solid #2c4a3a}
.term .ask{font-size:15px;margin:2px 0 8px;color:#fff}
/* the SQL desk's tiers, coloured requests and casebook (SQL-CURRICULUM.md) */
.ladder{display:inline-flex;gap:3px;margin-left:8px;vertical-align:middle}.ladder i{font:600 10.5px var(--f-mono);font-style:normal;padding:1px 6px;border-radius:3px;background:#2c3a32;color:#8fb3a0}.ladder i.done{background:#2f5a43;color:#cfeedd}.ladder i.on{background:var(--term-hi);color:#0d1611}
.ck{border-radius:3px;padding:0 3px;box-shadow:inset 0 -2px 0 currentColor}.ck-select{color:#9ad1ff}.ck-where{color:#ffd166}.ck-order{color:#c3a6ff}.ck-agg{color:#7ee0a8}.ck-group{color:#ff9f7a}
.casebook{margin-top:10px;font-size:12.5px;background:#fbf6e6;color:#2b2620;border-radius:6px;padding:8px 10px;box-shadow:2px 4px 8px #0004}.casebook ul{margin:6px 0 0;padding:0;list-style:none}.casebook li{display:flex;gap:8px;justify-content:space-between;padding:2px 0;border-top:1px dashed #d8cba8}.casebook code{font-size:11.5px;color:#7a1c1c}
.trapwhy{margin-top:8px;font-size:13px}.fb .up{color:#1f7a4a}
/* a wrong query (SQL-MISSES.md): the slip box, the hint ladder, the checklist, the row diff */
.fb.slip{background:#fff4d6;color:#6b4a00}.fb.slip .example,.rung .example{margin-top:6px}
mark{background:#ffd166;color:#2a1d00;border-radius:2px;padding:0 1px;box-shadow:0 0 0 2px #e0a800}
.rung{margin-top:10px;padding:8px 10px;border-left:3px solid #c3a6ff;background:var(--panel,#f6f1ff);border-radius:6px;font-size:13px}
.rung>small{display:block;font:600 11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);margin-bottom:4px}
.rung p{margin:4px 0}.rung p.ok{color:#1f7a4a}
.checks{margin:4px 0 0;padding-left:20px}.checks li{margin:2px 0}.checks li.ok{color:#1f7a4a}.checks li.ok::marker{content:"✓ "}
.checks li.off{color:#8a2b22}.checks li.off::marker{content:"✗ "}.checks li.todo{color:var(--ink2);opacity:.6}
table.diff{border-collapse:collapse;margin-top:6px;font:12px var(--f-mono)}table.diff th,table.diff td{border:1px solid var(--line);padding:2px 6px;text-align:left}
table.diff td.lab{font:600 11px var(--f-sans,inherit);background:var(--loss-bg)}
.hintbtn{margin-top:10px;font:inherit;font-size:13px;padding:6px 10px;border-radius:6px;border:1px solid #8b6fd6;background:#efe7ff;color:#3b2a73;cursor:pointer}
.hintbtn[disabled]{opacity:.5;cursor:default}small.wait{display:block;margin-top:4px;color:var(--ink2)}
.where{margin-top:10px;font-size:13px}.picks{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.picks button{font:inherit;font-size:12px;padding:5px 8px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer}.picks button:hover{background:#efe7ff}
p.shaky{font-size:12px;color:#8a5a00;margin-top:8px}.fb .row{margin-top:8px;display:flex;gap:8px}.fb .row button{font:inherit;font-size:13px;padding:5px 10px;border-radius:6px;border:1px solid var(--line);cursor:pointer}
.chain{margin:6px 0 8px;padding-left:22px;font-size:14px}.chain li{margin:4px 0;padding:4px 6px;border-radius:5px}.chain li.on{background:#fff3;font-weight:600}.chain li.todo{opacity:.45}
.chain li.given{opacity:.8}.chain li.given .example{font-size:11.5px;margin:3px 0;padding:4px 8px}
.plan{margin:4px 0 8px;padding-left:22px;font-size:13.5px}.plan li{margin:3px 0}.plan code{background:#ffffff1a;padding:0 5px;border-radius:3px;margin-right:4px}
.bcard.stage{background:#e8f1fb;border-top:4px solid #5b8fd1;transform:rotate(1deg)}.bcard.stage h4 small{font-size:10px;color:#5b8fd1;letter-spacing:.08em;text-transform:uppercase}
header .rev{margin-right:8px;border-color:#ffd166;color:#ffd166}
.chain li.done>span{text-decoration:line-through;text-decoration-color:#7ee0a8aa}.chain .hint{display:block;font-weight:400;opacity:.85;margin-top:2px}.chain .mini .res{margin-top:4px;font-size:11.5px}.chain .mini .res td,.chain .mini .res th{padding:1px 6px}
.tags{margin-left:8px}.tags .ck{font-size:11px;font-weight:600;padding:0 5px;margin-right:6px}
.replay{margin-top:10px;font-size:13px;background:#0003;border-radius:6px;padding:8px 10px}.replay table{border-collapse:collapse;margin:6px 0}.replay td,.replay th{padding:2px 12px 2px 0;text-align:left}.replay tr.off td{color:#ff9f7a;font-weight:700}
.ownersay{display:flex;gap:10px;align-items:flex-start;margin:8px 0;padding:8px 10px;background:#fbf6e6;color:#2b2620;border-radius:6px}.ownersay p{margin:2px 0 0}.ownersay img{flex:none;image-rendering:pixelated;border-radius:4px}
.cork.big{gap:14px 8px;justify-content:space-between}.cork.big .bcard{min-width:0;flex:1 1 44%;max-width:49%;padding:8px 8px 6px}.cork.big .bcard h4{font-size:13.5px}.cork.big .bcard li{font-size:11.5px;padding:0 3px}.cork.big .bcard li i{font-size:9.5px;margin-left:3px}.cork.big .bsmall{font-size:9.5px}
.bstep{margin:6px 0}.bstep small{opacity:.8}.bstep .res{font-size:12px}
/* batch 3: the verdict under the box, what's left, the folded board, the stamp */
.desk:has(.sheet.term){align-items:flex-start}
.term .verdict .done{color:var(--term-dim);margin:6px 0 0}.term .verdict .fb:first-child{margin-top:10px}.term .verdict .go{margin-top:10px}
.term .verdict{margin-bottom:12px}
.togo{margin-left:8px;font:600 11px var(--f-mono);color:var(--term-hi)}
.cork .folded{flex-basis:100%;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tchip{font:12px var(--f-mono);padding:3px 9px;border-radius:4px;background:#fbf6e6cc;color:#5a4a3a;border:1px dashed #4a2f1a;cursor:pointer}.tchip.glow{background:#ffe27a;border-style:solid;color:#2b2620}
.res.stamped{position:relative}
.stamp{position:absolute;right:14px;top:18px;font:700 20px var(--f-pix);letter-spacing:.12em;color:#3fd18b;border:3px solid currentColor;border-radius:6px;padding:2px 10px;transform:rotate(-9deg);opacity:.9;animation:stampin .28s cubic-bezier(.2,1.6,.4,1) both;pointer-events:none}
.stamp.closed{color:#ff5b5b;font-size:24px}
@keyframes stampin{from{transform:rotate(-9deg) scale(2.4);opacity:0}to{transform:rotate(-9deg) scale(1);opacity:.9}}
.term .res.stamped::before{display:none}
.closed{margin-top:8px;font-weight:600}
.pips{display:inline-flex;gap:3px;margin-left:8px;vertical-align:middle}.pips i{width:10px;height:10px;border-radius:2px;background:#2c3a32;border:1px solid #3d5446}.pips i.g{background:var(--term-hi)}.pips i.b{background:#e5484d}
.sumrow{display:flex;gap:20px;margin-top:6px}.sumrow b{display:block;font-size:24px}.sumrow span{font-size:12px;color:#7a6c52}
.term .later{color:var(--term-ink);font-size:14px}
.acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.acts .x{margin-top:12px}
.side .cork{margin-top:12px;padding:16px 10px 12px;gap:14px}.side .bcard{min-width:150px}.bcard.b2{transform:rotate(1.5deg)}
.peek{font-size:12.5px}
.recap .learned{padding-left:18px}.recap .learned li{margin:6px 0}
textarea.sql,.res,.example,code{font-variant-ligatures:none!important;font-feature-settings:"calt" 0,"liga" 0,"dlig" 0!important}
</style>
