.levels{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.tile .pin,.pinbtn{font:600 11.5px var(--sans);border:1px solid var(--line);background:var(--panel);color:var(--ink2);border-radius:7px;padding:3px 8px;cursor:pointer}

.review .pin,.review .pinbtn,.review [data-open]{pointer-events:none}.review .pin,.review .pinbtn{display:none}
.tile.right{outline:2px solid var(--pass)}.tile.right h5::after{content:" · the answer";color:var(--pass);font-weight:700}

.chg td.n{font:700 11px var(--mono);color:var(--ai);width:18px}.chg td.d{font:600 12px var(--mono);white-space:nowrap}.chg td.w{color:var(--muted);white-space:nowrap}

small.pos-below{color:var(--fail);font-weight:700}small.pos-above{color:var(--pass);font-weight:700}

  if (EMBED) document.addEventListener('keydown', e => { if (e.key === 'Escape' && !document.querySelector('.veil')) toOffice({type: 'esc'}); }, true);   // Esc steps away from the desk
  if (prof) { const f = window.fetch.bind(window); window.fetch = (u, o) => f(typeof u === 'string' && u.startsWith('/api/lf') ? u + (u.includes('?') ? '&' : '?') + 'profile=' + encodeURIComponent(prof) : u, o); } })();
</script>
<script type="module">if (EMBED) import('/shared/desk/desk.mjs').then(d => d.mountDesk({theme: 'signal', tutor: ['.guide', '.sym']}));   // in the office: Priya's signal room, pop-out tutorial, full screen (games/shared/desk)</script></head>
<body>

</main>
<div class="tip" id="tip"></div>
<input id="keysink" aria-hidden="true" tabindex="-1" autocomplete="off" style="position:fixed;left:-200px;top:0;width:1px;height:1px;opacity:0">
<script>
const TOUCH = matchMedia('(hover: none) and (pointer: coarse)').matches;   // a finger, not a mouse: no keys taught, no key nudges
if (TOUCH) document.documentElement.classList.add('touch');
// The game's text says "click" and "Keys 1 to 8 pick a row" in many places (here, path.js, modes.js and the lf_*.py
// content). On a phone every text node is rewritten as it lands, and narration gets the same words (voLines).
const tapWords = t => t.replace(/\s*Keys? \d+ (?:to|-|–) \d+ [^.]*\.|\s*Press <?kbd>?[^.]*\./g, '').replace(/\b([Cc])lick(?=\s|\.|,|$)(?! rate| ?-)/g, (m, c) => c === 'C' ? 'Tap' : 'tap');
if (TOUCH) new MutationObserver(ms => { for (const m of ms) for (const n of m.addedNodes) {
  const w = n.nodeType === 3 ? [n] : n.nodeType === 1 ? (() => { const a = [], it = document.createTreeWalker(n, NodeFilter.SHOW_TEXT); while (it.nextNode()) a.push(it.currentNode); return a; })() : [];
  w.forEach(x => { if (/[Cc]lick|Keys? \d/.test(x.data)) { const v = tapWords(x.data); if (v !== x.data) x.data = v; } }); } }).observe(document.documentElement, {childList: true, subtree: true});
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
// the Fernhill cast in pixel art (games/shared/pixel, made with pxl), the same people as Test Board and the office game.
// Framing only: a face beside the feedback, the office above the hub. Missing art just disappears.
const pxFace = (who, face) => `<img class="pxr" src="/px/sprites/face_${who}_${face}.png" alt="" aria-hidden="true" onerror="this.remove()">`;
const pxr = ok => pxFace('priya', ok ? 'smile' : 'worried');
const pxBanner = (line) => `<div class="pxban"><img class="pxroom" src="/px/scenes/office_crew.png" alt="" aria-hidden="true" onerror="this.parentNode.remove()">
  <div class="pxsay">${pxFace('dana', 'calm')}<div><b>Dana · VP of Marketing</b><span>${line}</span></div></div></div>`;
// the message cards (.sym) name who's asking: show their pixel face instead of the letter
new MutationObserver(() => document.querySelectorAll('.sym .who:not([data-px])').forEach(el => {
  el.dataset.px = 1; const t = (el.parentElement.querySelector('p') || el.parentElement).textContent.trim();
  const who = /^Dana\b/.test(t) ? 'dana' : /^Priya\b/.test(t) ? 'priya' : null;
  if (who) el.outerHTML = pxFace(who, /\?|wrong|off|down|low|broke/i.test(t) ? 'worried' : 'calm');
})).observe(document.body, {childList: true, subtree: true});
const money = v => '$' + Math.round(v).toLocaleString();
const pct = (v, dp = 1) => v == null || !isFinite(v) ? '–' : (v * 100).toFixed(dp) + '%';
const num = v => Math.round(v).toLocaleString();
const post = (u, b) => fetch(u, {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify(b)}).then(r => r.json());
const app = document.getElementById('app');
let S = null;            // current session: {session, case, ...}
let ST = {};             // case state: opened tiles, pins, answers, minutes, hints
let PROG = null;
const tip = document.getElementById('tip');
const untip = () => { tip.style.display = 'none'; };
document.addEventListener('click', untip, true);   // a click usually swaps the screen, and a removed node never gets its mouseleave
function tips(root) { if (TOUCH) root.querySelectorAll('[data-tip]').forEach(n => n.addEventListener('click', e => { const r = n.getBoundingClientRect(); tip.innerHTML = n.dataset.tip; tip.style.display = 'block'; tip.style.left = Math.max(8, Math.min(r.left, innerWidth - 308)) + 'px'; tip.style.top = (r.bottom + 6) + 'px'; }));   // no hover on a phone: a tap shows it, the next tap hides it
  root.querySelectorAll('[data-tip]').forEach(n => { n.onmousemove = e => { tip.innerHTML = n.dataset.tip; tip.style.display = 'block'; tip.style.left = Math.min(e.clientX + 12, innerWidth - 300) + 'px'; tip.style.top = e.clientY + 12 + 'px'; }; n.onmouseleave = () => tip.style.display = 'none'; }); }
const ev = (type, detail = {}) => S && post('/api/lf/event', {session: S.session, type, detail: {...detail, minute: ST.minutes}});

// ================================================================ voice: Talk it through lives in lifecycle_files_coach.js (V, voiceStart, voiceStop)

// ================================================================ numbers from the case
function T() {
  const c = S.case, ks = ['delivered', 'opens', 'clicks', 'orders', 'revenue', 'unsubs'].concat(c.bounce_cats ? ['bounces', 'complaints'] : []), n = c.dates.length, out = {};
  ks.forEach(k => { out[k] = Array(n).fill(0); c.flow.messages.forEach(m => c.by_message[m.id][k].forEach((v, i) => out[k][i] += v)); });
  out.entered = c.entered; return out;
}
const sum = (a, i, j) => a.slice(i, j).reduce((x, y) => x + y, 0);
const roll = a => a.map((_, i) => i < 6 ? null : sum(a, i - 6, i + 1));
const TIPS = {   // shown the first time each tile is opened
  entered: 'This is the top of the funnel. If it falls, every email gets fewer people, but each email can still be fine.',
  delivered: 'Entered minus anyone suppressed (Smart Sending, exclusions) or bounced. A gap here is deliverability or suppression, not content.',
  opens: 'Apple Mail opens emails automatically for privacy, so opens run high and jump around. Use them for subject lines at most.',
  clicks: 'Clicks show the email itself working: content, images, links. If clicks hold, the email is probably fine.',
  orders: 'Orders per recipient. Compare with Clicks: clicks steady but orders down means the problem is after the click.',
  order_size: 'Revenue per order. Orders steady but smaller means a deeper discount or a cheaper product in front. A single spike is usually one big order.',
  unsubs: 'Unsubscribes barely touch revenue this week, which is why they hide. Each one is a person you can never email again.',
  registry: 'Every flow in the program against its own four quiet weeks. Rank by the dollars column, not the percent: a big percent on a small flow can be worth less than a small percent on a big one.',
  today: 'The alerts fire when a flow\'s revenue per recipient moves 15% or more against last week. Check how sure each one is: on a small flow, a swing like that is often chance. And the rule can\'t see a flow losing people, or a slow slide.',
  changes: 'Every edit to the flow, plus what happened in the store and in Klaviyo, by day. A change only explains what it can touch: subject lines move opens and clicks, content moves clicks, codes and products move orders, filters move who enters.',
  messages: 'Every email in the flow side by side, last 7 days against the four quiet weeks. The fastest way to tell "one email" from "the whole flow".',
  bounces: 'Bounces per email sent. A bounce means the provider refused it. An email filed to spam is not a bounce: it counts as delivered. Bounce details says why they were refused.',
  complaints: 'Spam complaints per delivered email, as Klaviyo sees them. Klaviyo only hears from providers that send a complaint feed. Gmail and Apple don\'t, so their complaints show as zero here. Gmail\'s are in Postmaster.',
  providers: 'Every inbox provider against its own four quiet weeks. Gmail is usually half the list. Apple opens almost everything for privacy, so read Apple by clicks. A provider out of line on its own points at that provider; every provider moving together points at your side.',
  postmaster: 'Gmail\'s own numbers. The spam rate is complaints over emails that reached the inbox, and it\'s the one Gmail acts on: keep it under 0.10%, never let it reach 0.30%. It runs a day late, and days with little Gmail volume are left blank.',
  bounce_details: 'Klaviyo sorts every bounce into a category. Technical means DNS or authentication (your setup). Reputation and Frequency mean the provider judges you (or your sending pool). Invalid address means the list.',
  entered4: 'Emails we sent to this provider. If it jumps, so do complaints and bounces, even if the rate holds: a new domain or an old segment sending double is how reputations get hurt.',
  delivered4: 'Sent minus bounces: the share the provider accepted. Accepted is not the inbox. An email filed to spam still counts as delivered.',
  opens4: 'Apple opens almost every email for privacy, so Apple\'s open rate barely moves even when its mail goes to junk. Gmail\'s opens are mostly real people. Read the inbox by clicks.',
  credit: 'Klaviyo gives each order to the last message a buyer opened or clicked (5 days for email). A big campaign week moves orders from flows to campaigns. If the total holds, the money didn\'t move, only the credit.',
  pressure: 'How many messages each person gets. Campaigns reach everyone, flows reach the people doing something, so the busiest people are the ones in flows. The click lines split people already on the list from new signups: fatigue shows in the first, a weak crowd of signups in the second.',
  skipped: 'Why messages didn\'t go out. Smart Sending skips anyone emailed in the last 16 hours (campaigns count). Flow filters skip people the flow shouldn\'t reach any more. A rise is only a problem for some reasons.',
  timing: 'The curve is the share of first-time buyers who have bought again by each day. The median is the day half of the eventual returners are back: windows are built from it. The average is pulled late by a few slow returners. Each timed flow is a dot (its send day) against a gray window.',
  cohorts: 'Each row is one month\'s first-time buyers. A cell fills only once the whole month has had that many days, so the newest rows are blank or "so far". Compare a month with the same month last year, and check how it came in (discount share, first product) before blaming the flows.',
  log6: 'Every change to the timed flows (delays, triggers, content) and to how customers come in (promotions, launches), by day. A timing gap that was there all along has no change to point at.',
  log5: 'Every change to the calendar, flows, filters, segments and SMS, by day. A change explains only what it can touch: the calendar moves campaigns and Smart Sending skips, filters move who enters or gets skipped, segments move who campaigns reach.',
  log: 'What changed on our side and in Klaviyo, by day. Copy and admin changes can\'t move deliverability. DNS, templates, segments, links, domains and volume can.',
};
const seenTips = () => { try { return JSON.parse(localStorage.getItem('lf-tips') || '{}'); } catch (e) { return {}; } };
function tipKey(k) { return S && S.case && S.case.bounce_cats && TIPS[{entered: 'entered4', delivered: 'delivered4', opens: 'opens4'}[k]] ? {entered: 'entered4', delivered: 'delivered4', opens: 'opens4'}[k] : k; }
function tipFor(k) { k = tipKey(k); return TIPS[k] ? `<div class="ftip">First time here: ${esc(TIPS[k])}</div>` : ''; }
function markTip(k) { const s = seenTips(); s[k] = 1; try { localStorage.setItem('lf-tips', JSON.stringify(s)); } catch (e) {} }
const SERIES = {   // tile key -> how to compute a daily 7-day series, how to show it
  entered: {f: t => roll(t.entered), fmt: v => num(v), q: 'Did fewer people start the flow?', unit: 'people a week'},
  delivered: {f: t => roll(t.delivered), fmt: v => num(v), q: 'Did everyone who entered get the emails?', unit: 'emails a week'},
  opens: {f: t => ratio(t.opens, t.delivered), fmt: v => pct(v), q: 'Opens (inflated by Apple Mail Privacy)', unit: 'open rate'},
  clicks: {f: t => ratio(t.clicks, t.delivered), fmt: v => pct(v, 2), q: 'Is the email itself getting clicked?', unit: 'click rate'},
  orders: {f: t => ratio(t.orders, t.delivered), fmt: v => pct(v, 2), q: 'Do people buy after getting it?', unit: 'placed-order rate'},
  order_size: {f: t => ratio(t.revenue, t.orders), fmt: v => money(v), q: 'Are orders smaller or bigger?', unit: 'revenue per order'},
  unsubs: {f: t => ratio(t.unsubs, t.delivered), fmt: v => pct(v, 2), q: 'Are people leaving the list?', unit: 'unsubscribe rate'},
};
const SERIES4 = {   // Level 4: one provider's mail. Sent is people a week, the rest are rates
  entered: {f: t => roll(t.entered), fmt: v => num(v), q: 'Did we send more or less?', unit: 'emails sent a week'},
  delivered: {f: t => ratio(t.delivered, t.entered), fmt: v => pct(v, 1), q: 'Did the provider accept them?', unit: 'delivered rate'},
  bounces: {f: t => ratio(t.bounces, t.entered), fmt: v => pct(v, 2), q: 'Did the provider refuse more?', unit: 'bounce rate'},
  opens: SERIES.opens, clicks: SERIES.clicks, orders: SERIES.orders,
  complaints: {f: t => ratio(t.complaints, t.delivered), fmt: v => pct(v, 3), q: 'Spam complaints (as Klaviyo sees them)', unit: 'complaint rate'},
  unsubs: SERIES.unsubs,
};
const SER = () => S.case.bounce_cats ? SERIES4 : SERIES;
function ratio(a, b) { const ra = roll(a), rb = roll(b); return ra.map((v, i) => v == null || !rb[i] ? null : v / rb[i]); }
function change(series) { const base = series.slice(6, 28).filter(v => v != null), b = base.reduce((x, y) => x + y, 0) / base.length, last = series[series.length - 1]; return {base: b, last, ch: b ? last / b - 1 : 0}; }
function chg(c) { const cls = Math.abs(c) < 0.08 ? 'flat' : c < 0 ? 'dn' : 'up'; return `<span class="chg ${cls}">${c >= 0 ? '▲' : '▼'} ${Math.abs(c * 100).toFixed(0)}%</span>`; }

// ================================================================ charts
function lineSvg(series, {fmt, band, clickable, pinDay, height = 210, dots, width = innerWidth < 640 ? 440 : 900}) {   // a phone draws fewer units so the text stays readable
  const ansDay = ST.review && ST.review.since; if (ST.review) clickable = null;
  const W = width, H = height, L = width < 600 ? 48 : 62, R = 14, Tp = 12, B = 30, n = series.length;
  const vals = series.filter(v => v != null).concat(band ? [band.lo, band.hi] : []);     // single-day dots are clamped, not scaled to
  let lo = Math.min(...vals), hi = Math.max(...vals); const pad = (hi - lo) * 0.12 || hi * 0.1 || 1; lo = Math.max(0, lo - pad); hi += pad;
  const x = i => L + i / (n - 1) * (W - L - R), y = v => Tp + (1 - (v - lo) / (hi - lo)) * (H - Tp - B);
  const d = series.map((v, i) => v == null ? '' : `${series[i - 1] == null ? 'M' : 'L'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  const yt = [lo + (hi - lo) * 0.1, (lo + hi) / 2, hi - (hi - lo) * 0.1];
  const id = 'c' + Math.random().toString(36).slice(2, 8);
  setTimeout(() => {
    const el = document.getElementById(id); if (!el) return;
    el.onmousemove = e => { const r = el.getBoundingClientRect(), i = Math.max(0, Math.min(n - 1, Math.round(((e.clientX - r.left) / r.width * W - L) / (W - L - R) * (n - 1))));
      tip.innerHTML = `<b>${S.case.dates[i]}</b><br>7-day: ${series[i] == null ? '–' : fmt(series[i])}${dots && dots[i] != null ? `<br>that day: ${fmt(dots[i])}` : ''}${clickable ? '<br><i>click to mark "started here"</i>' : ''}`;
      tip.style.display = 'block'; tip.style.left = Math.min(e.clientX + 12, innerWidth - 300) + 'px'; tip.style.top = e.clientY + 12 + 'px'; };
    el.onmouseleave = () => tip.style.display = 'none';
    if (clickable) el.onclick = e => { const r = el.getBoundingClientRect(), i = Math.max(0, Math.min(n - 1, Math.round(((e.clientX - r.left) / r.width * W - L) / (W - L - R) * (n - 1)))); clickable(S.case.dates[i]); };
  });
  const pi = pinDay ? S.case.dates.indexOf(pinDay) : -1;
  return `<svg viewBox="0 0 ${W} ${H}" id="${id}" class="lsvg" style="${clickable ? 'cursor:crosshair' : ''}">
    ${band ? `<rect x="${L}" y="${y(band.hi)}" width="${W - L - R}" height="${Math.max(2, y(band.lo) - y(band.hi))}" fill="var(--band)"/><text class="ax" x="${L + 6}" y="${y(band.hi) + 12}">normal range (the four quiet weeks)</text>` : ''}

    ${dots ? dots.map((v, i) => v == null ? '' : `<circle cx="${x(i)}" cy="${y(Math.max(lo, Math.min(hi, v)))}" r="2.2" fill="var(--muted)" opacity=".45"/>`).join('') : ''}
    <path d="${d}" fill="none" stroke="var(--curve)" stroke-width="2.25"/>
    ${pi >= 0 ? `<line x1="${x(pi)}" x2="${x(pi)}" y1="${Tp}" y2="${H - B}" stroke="var(--accent)" stroke-width="2"/><text class="acc" x="${x(pi) + 4}" y="${Tp + 10}">${ST.review ? 'you: ' : 'started '}${pinDay.slice(5)}</text>` : ''}
    ${ST.open.changes && S.case.changes ? S.case.changes.map((ch, k) => { const ci = S.case.dates.indexOf(ch.date); return ci < 0 ? '' : `<line x1="${x(ci)}" x2="${x(ci)}" y1="${H - B - 8}" y2="${H - B}" stroke="var(--ai)" stroke-width="2"/><text x="${x(ci)}" y="${H - B - 11}" text-anchor="middle" style="font:700 ${W < 600 ? 9 : 10}px var(--mono);fill:var(--ai)">${k + 1}</text>`; }).join('') : ''}
    ${ansDay && S.case.dates.indexOf(ansDay) >= 0 ? (() => { const ai = S.case.dates.indexOf(ansDay); return `<line x1="${x(ai)}" x2="${x(ai)}" y1="${Tp}" y2="${H - B}" stroke="var(--pass)" stroke-width="2.5" stroke-dasharray="5 3"/><text x="${x(ai) + 4}" y="${Tp + 24}" style="font:700 11px var(--sans);fill:var(--pass)">answer ${ansDay.slice(5)}</text>`; })() : ''}
  </svg>`;
}

// ================================================================ the case screen (Level 1, and Level 0's worked case)
function mainCard() {
  const t = T(), view = ST.view || 'rpr', c = S.case, b = c.band;
  const rpr = ratio(t.revenue, t.delivered), rev = roll(t.revenue);

  return `<div class="card mc" data-g="main"><div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap"><h4>${esc(c.flow.name)}</h4>${c.stage && c.level ? `<span class="stage ${c.stage}" data-tip="${esc(c.stage_note)}">${esc(c.stage_badge)}</span>` : ''}
    <span class="meta">${c.bounce_cats ? `every campaign and flow email to ${esc(c.flow.name)} addresses` : c.single ? (c.fid === 'camp' ? 'every campaign sent' : c.fid === 'sms' ? 'every text this flow sent' : 'every email this flow sent') : `${c.flow.messages.length} emails, sent ${c.flow.messages.map(m => 'day ' + m.day).join(', ')} after the trigger`} · last 8 weeks to ${c.today}</span><span style="flex:1"></span>
    <div class="seg">${[['rpr', 'Revenue per recipient'], ['rev', 'Revenue']].map(([k, l]) => `<button class="${view === k ? 'on' : ''}" data-view="${k}">${l}</button>`).join('')}</div></div>
    ${view === 'rpr' ? lineSvg(rpr, {fmt: v => '$' + v.toFixed(2), band: b, clickable: d => setAns('since', d), pinDay: ST.ans.since, dots: dayr})
      : lineSvg(rev, {fmt: v => money(v), clickable: d => setAns('since', d), pinDay: ST.ans.since === 'none' ? null : ST.ans.since})}
    ${caseFacts(t)}
    <p class="meta" style="margin:8px 0 0">${ST.review ? '' : 'Click the chart to mark the day something started. '}Dots are single days, the line is the last 7 days.</p></div>`;
}
const DOLLAR_TIP = {gap: 'Revenue gap: the quiet weeks\' average revenue − the last 7 days. Use it when fewer people got the emails and each one spent about the same',
  rate: 'RPR gap × recipients: (the baseline RPR − the last 7 days\' RPR) × the emails delivered in the last 7 days. Use it when each person spent less',
  zero: 'Nothing wrong (inside the normal range, or only the comparison was odd): $0 at stake'};
function caseFacts(t) {   // the stat rows Brent asked for on the path (labels on top, the number below, % from baseline), on the case screen too
  const c = S.case, b = c.band, n = c.dates.length, del7 = sum(t.delivered, n - 7, n), rev7 = sum(t.revenue, n - 7, n), base4 = sum(t.revenue, 0, 28) / 4;
  const prev = sum(t.revenue, n - 14, n - 7), bRpr = sum(t.revenue, 0, 28) / Math.max(1, sum(t.delivered, 0, 28)), lRpr = del7 ? rev7 / del7 : 0;
  const rows = [
